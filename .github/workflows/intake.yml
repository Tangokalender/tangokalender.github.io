# Issue forms → event files → pull request for review.
name: Intake
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  intake:
    uses: Tangokalender/TangoKalender.jl/.github/workflows/site-intake.yml@v1.1.0
