name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:   # just after midnight Norwegian time (summer and winter), so «today» and past events stay right
    - cron: '17 22 * * *'
    - cron: '17 23 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages:
    uses: Tangokalender/TangoKalender.jl/.github/workflows/site-pages.yml@v1.0.1
